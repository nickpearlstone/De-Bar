name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    ci:
      runs-on: ubuntu-latest
    
      timeout-minutes: 20

      steps:
        - name: Check out the repo
          uses: actions/checkout@v5

        - name: Install uv (with dependency caching)
          uses: astral-sh/setup-uv@v7
          with:
            enable-cache: true
            python-version: "3.11"

        - name: Create .env file
          run: echo 'TOKEN="${{ secrets.HF_TOKEN }}"' > .env

        - name: Debug Environment File Setup
          run: |
            echo "Checking if .env exists:"
            ls -la .env
            echo "Checking keys in .env (values hidden):"
            sed 's/=.*/=***hidden***/' .env

        - name: Install Python + dependencies exactly as locked
          
          run: uv sync --frozen

        - name: Run tests
          
          run: uv run pytest
          
        - name: Ruff linting
          run: uv run ruff check --output-format=github . 

        - name: Ruff format check
          run: uv run ruff format --check 